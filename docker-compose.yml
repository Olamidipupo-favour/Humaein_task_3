version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: rcm-gcc-db
    environment:
      POSTGRES_DB: rcm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rcm-network

  # Flask API
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: rcm-gcc-api
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/rcm
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - APP_ENV=production
      - ALLOW_ORIGINS=http://localhost:3000,http://web:3000
      - MODEL_NAME=gemini-1.5-pro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rcm-network
    restart: unless-stopped

  # Next.js Frontend
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: rcm-gcc-web
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
      - DEMO_LOGIN=true
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rcm-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  rcm-network:
    driver: bridge
