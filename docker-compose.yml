version: "3.8"

services:
  # Flask API
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: rcm-gcc-api
    environment:
      - DATABASE_URL=postgresql+psycopg://humaein:Postgres123!!@ep-lively-sun-a5i0suhp-pooler.us-east-2.aws.neon.tech:5432/rcm
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - APP_ENV=${APP_ENV:-production}
      - DEBUG=${DEBUG:-false}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_API_KEY_1=${GOOGLE_API_KEY_1:-}
      - GOOGLE_API_KEY_2=${GOOGLE_API_KEY_2:-}
      - MODEL_NAME=${MODEL_NAME:-gemini-2.5-flash-lite}
      - ALLOW_ORIGINS=${ALLOW_ORIGINS:-http://localhost:3000,http://localhost:3001,http://web:3001,http://147.93.112.143:3001,http://147.93.112.143:3002,http://147.93.112.143:3003,http://147.93.112.143:9301}
      - API_VERSION=${API_VERSION:-v1}
      - MAX_CONTENT_LENGTH=${MAX_CONTENT_LENGTH:-16777216}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-30}
      - AI_TIMEOUT=${AI_TIMEOUT:-60}
    ports:
      - "9301:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rcm-network
    restart: unless-stopped

  # Next.js Frontend
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://147.93.112.143:9301
    container_name: rcm-gcc-web
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://147.93.112.143:9301
      - DEMO_LOGIN=true
      - PORT=3001
    ports:
      - "3003:3001"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - rcm-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  rcm-network:
    driver: bridge
