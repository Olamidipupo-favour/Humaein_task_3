version: "3.8"

services:
  # Flask API
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: rcm-gcc-api
    environment:
      - DATABASE_URL=postgresql+psycopg://humaein:Postgres123!!@ep-lively-sun-a5i0suhp-pooler.us-east-2.aws.neon.tech:5432/rcm
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - APP_ENV=production
      - ALLOW_ORIGINS=ttp://localhost:3000,http://localhost:3001,http://web:3001,http://145.223.88.159:3001,http://145.223.88.159:3002
      - MODEL_NAME=gemini-1.5-pro
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rcm-network
    restart: unless-stopped

  # Next.js Frontend
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://145.223.88.159:8001
    container_name: rcm-gcc-web
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://145.223.88.159:8001
      - DEMO_LOGIN=true
      - PORT=3001
    ports:
      - "3002:3001"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rcm-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  rcm-network:
    driver: bridge
